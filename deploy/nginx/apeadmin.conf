# =============================================================================
# ApeAdmin 生产 Nginx 配置（宝塔面板）
#
# 使用方法:
#   1. 宝塔面板 → 网站 → 添加站点（绑定你的域名，纯静态即可）
#   2. 站点设置 → 配置文件，用本文件内容整体替换（注意保留宝塔生成的
#      ssl 证书段，如已配置 HTTPS）
#   3. 或：站点设置 → 反向代理，按下方 proxy 段手动填写
#   4. 修改 server_name / root 为实际值
#   5. nginx -t 校验后 reload
#
# 架构: 所有请求反代到后端 FastAPI (127.0.0.1:8000)
#       - /api/    REST API
#       - /admin/  管理后台 SPA（由后端挂载 frontend_dist）
#       - /apehub-web/ 官网与静态资源（由后端挂载）
#       - /docs /redoc API 文档（生产可按需屏蔽）
# =============================================================================

server {
    listen 80;
    listen 443 ssl http2;
    server_name your-domain.com;          # ← 改成你的域名

    # 若暂无证书，先注释掉 443 段与下面两行，用宝塔申请后再放开
    # ssl_certificate    /www/server/panel/vhost/cert/your-domain.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/your-domain.com/privkey.pem;

    # 上传大小限制（插件市场 ZIP 最大 50MB，留余量）
    client_max_body_size 100m;

    # ---- 安全响应头（按需开启） ----
    # add_header X-Frame-Options SAMEORIGIN;
    # add_header X-Content-Type-Options nosniff;

    # ---- 日志 ----
    access_log /www/wwwlogs/apeadmin.log;
    error_log  /www/wwwlogs/apeadmin.error.log;

    # ---- 后端唯一入口：全部反代到 FastAPI ----
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE 支持（MCP 传输层 /mcp/sse 需要）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- 可选：屏蔽 API 文档（生产建议屏蔽） ----
    # location ~ ^/(docs|redoc|openapi.json) {
    #     deny all;
    #     return 404;
    # }

    # ---- 静态资源缓存（可选优化） ----
    # location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_cache_valid 200 7d;
    #     expires 7d;
    # }
}

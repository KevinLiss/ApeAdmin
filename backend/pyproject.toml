[project]
name = "apeadmin"
version = "0.1.0"
description = "ApeAdmin - FastAPI + Vue3 admin framework with plugin & MCP support"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiomysql>=0.2.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "redis>=5.0.0",
    "orjson>=3.10.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
# AI 会议助手（aimeeting 插件）运行时依赖：语音转写 + 说话人分离 + 流式识别。
# 全部纯 CPU 推理（ctranslate2 / onnxruntime int8），无需 torch/CUDA。
# 重建环境：pip install -e ".[meeting]"，模型另见 scripts/setup_aimeeting_env.sh
meeting = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.2",
    "sherpa-onnx==1.13.7",
    "onnxruntime==1.29.0",
    "av==18.1.0",
    "numpy==2.5.3",
    "ffmpeg-python==0.2.0",
    "tokenizers==0.23.2",
    "huggingface_hub==1.30.0",
]

[project.scripts]
apeadmin = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.alembic]
script_location = "alembic"
sqlalchemy.url = ""

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ApeHub - 个人中心</title>
<meta name="description" content="ApeHub 开发者中心，管理插件版本、购买授权、USDT 收益与提现。">
<link rel="icon" href="/apehub-web/assets/logo.png">
<link rel="stylesheet" href="/apehub-web/profile.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/apehub-web/index.html"><img src="/apehub-web/assets/logo.png" alt="ApeHub"><span>ApeHub</span></a>
    <nav class="nav"><a href="/apehub-web/index.html">首页</a><a href="/apehub-web/plugins.html">插件市场</a><a href="/apehub-web/docs-portal/">技术文档</a><a class="active" href="/apehub-web/profile.html">个人中心</a></nav>
    <div class="top-actions"><span class="user-name" id="userName"></span><button class="btn btn-small" id="logoutBtn">退出</button></div>
  </div>
</header>

<main class="page">
  <section class="auth-gate" id="authGate" hidden>
    <img src="/apehub-web/assets/logo.png" alt="">
    <h1>请先登录 ApeHub</h1>
    <p>登录后可以购买插件、提交作品并管理 USDT 收益。</p>
    <a class="btn btn-primary" href="/apehub-web/index.html">前往登录 / 注册</a>
  </section>

  <div id="app" hidden>
    <div class="page-title"><div><h1 id="profileName">个人中心</h1><p id="profileMeta"></p></div><button class="btn btn-primary" id="openPluginDialog">提交新插件</button></div>
    <section class="stats">
      <div class="stat"><span>可提现余额</span><strong id="statBalance">0 USDT</strong></div>
      <div class="stat"><span>提现冻结</span><strong id="statFrozen">0 USDT</strong></div>
      <div class="stat"><span>累计收益</span><strong id="statIncome">0 USDT</strong></div>
      <div class="stat"><span>我的插件</span><strong id="statPlugins">0</strong></div>
    </section>

    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="purchased">已购插件</button>
      <button class="tab" data-tab="developer">开发者工作台</button>
      <button class="tab" data-tab="income">销售收益</button>
      <button class="tab" data-tab="wallet">USDT 钱包与提现</button>
    </div>

    <section class="panel active" id="panel-purchased">
      <div class="section-head"><h2>已购插件</h2></div>
      <div class="table-wrap"><table><thead><tr><th>插件</th><th>当前版本</th><th>定价</th><th>授权</th><th>历史版本</th></tr></thead><tbody id="purchasedBody"></tbody></table></div>
    </section>

    <section class="panel" id="panel-developer">
      <div class="workspace">
        <aside class="plugin-list"><div class="plugin-list-head"><strong>我的插件</strong></div><div class="plugin-list-items" id="pluginList"></div></aside>
        <div class="workbench" id="workbench"><div class="workbench-empty">选择左侧插件进入版本工作台</div></div>
      </div>
    </section>

    <section class="panel" id="panel-income">
      <div class="section-head"><h2>销售收益</h2></div>
      <div class="table-wrap"><table><thead><tr><th>插件</th><th>收益</th><th>服务费率</th><th>状态</th><th>可提现时间</th></tr></thead><tbody id="incomeBody"></tbody></table></div>
    </section>

    <section class="panel" id="panel-wallet">
      <div class="wallet-grid">
        <form class="form-section" onsubmit="return false"><h2>TRC20 收款钱包</h2><div class="field"><label>USDT-TRC20 地址</label><input id="walletAddress" maxlength="34" placeholder="T 开头的 34 位地址"></div><div class="actions"><button class="btn btn-primary" type="button" id="saveWallet">保存钱包</button></div></form>
        <form class="form-section" id="withdrawForm"><h2>申请提现</h2><div class="field"><label>提现金额 (USDT)</label><input id="withdrawAmount" type="number" min="0" step="0.00000001" required></div><div class="field" style="margin-top:12px"><label>TRC20 收款地址</label><input id="withdrawAddress" maxlength="34" required></div><div class="fee-preview" id="feePreview"></div><div id="withdrawRule" style="color:var(--muted);font-size:12px"></div><div class="actions"><button class="btn btn-primary" type="submit">提交提现申请</button></div></form>
      </div>
      <div class="section-head" style="margin-top:24px"><h2>提现记录</h2></div>
      <div class="table-wrap"><table><thead><tr><th>申请</th><th>手续费</th><th>到账</th><th>地址</th><th>状态</th><th>交易哈希</th></tr></thead><tbody id="withdrawBody"></tbody></table></div>
    </section>
  </div>
</main>

<dialog id="pluginDialog">
  <form id="pluginForm">
    <div class="dialog-head"><h2>创建插件草稿</h2><button type="button" class="icon-btn" data-close title="关闭">×</button></div>
    <div class="dialog-body"><div class="form-grid">
      <div class="field"><label>插件标识</label><input name="name" required minlength="2" placeholder="my_plugin"></div>
      <div class="field"><label>插件标题</label><input name="display_name" required minlength="2"></div>
      <div class="field"><label>首个版本</label><input name="version" value="1.0.0" required></div>
      <div class="field"><label>期望售价 (USDT)</label><input name="price" type="number" min="0" step="0.01" value="0" required></div>
      <div class="field"><label>分类</label><select name="category"><option>工具</option><option>AI</option><option>电商</option><option>仪表盘</option><option>系统增强</option></select></div>
      <div class="field"><label>标签</label><input name="tags" placeholder="FastAPI,ApeAdmin"></div>
      <div class="field full"><label>插件介绍</label><textarea name="description" required></textarea></div>
    </div></div>
    <div class="dialog-foot"><button type="button" class="btn" data-close>取消</button><button class="btn btn-primary" type="submit">创建草稿</button></div>
  </form>
</dialog>

<dialog id="versionDialog">
  <form id="versionForm">
    <div class="dialog-head"><h2>创建新版本</h2><button type="button" class="icon-btn" data-close title="关闭">×</button></div>
    <div class="dialog-body"><div class="form-grid">
      <div class="field"><label>版本号</label><input name="version" required placeholder="1.1.0"></div>
      <div class="field"><label>兼容性</label><input name="compatibility" placeholder="ApeAdmin >= 0.1.0"></div>
      <div class="field full"><label>更新说明</label><textarea name="changelog"></textarea></div>
    </div></div>
    <div class="dialog-foot"><button type="button" class="btn" data-close>取消</button><button class="btn btn-primary" type="submit">创建版本</button></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>
<script src="/apehub-web/site-runtime.js?v=1.5.0"></script>
<script src="/apehub-web/profile-app.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ApeAdmin · 插件市场</title>
<meta name="description" content="ApeAdmin 插件市场 —— 发现、安装和管理 ApeAdmin 插件。" />
<link rel="icon" type="image/png" href="/apehub-web/assets/logo.png" />
<style>
  :root {
    --bg: #07080f;
    --bg-soft: #0c0e1a;
    --panel: rgba(255,255,255,0.04);
    --panel-2: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.08);
    --border-2: rgba(255,255,255,0.14);
    --primary: #6d5cff;
    --primary-2: #9d6bff;
    --accent: #22d3ee;
    --text: #eef0ff;
    --text-2: #a4a9c9;
    --text-3: #6b7096;
    --radius: 20px;
    --maxw: 1200px;
    --grad: linear-gradient(135deg, #6d5cff 0%, #9d6bff 50%, #d65ef0 100%);
    --grad-2: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
  }
  :root[data-theme="light"] {
    --bg: #f8fafc;
    --bg-soft: #ffffff;
    --panel: rgba(0,0,0,0.025);
    --panel-2: rgba(0,0,0,0.04);
    --border: rgba(0,0,0,0.08);
    --border-2: rgba(0,0,0,0.14);
    --primary: #6d5cff;
    --primary-2: #7c3aed;
    --accent: #0891b2;
    --text: #1e293b;
    --text-2: #475569;
    --text-3: #94a3b8;
    --grad: linear-gradient(135deg, #6d5cff 0%, #9d6bff 50%, #d65ef0 100%);
    --grad-2: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
  }
  :root[data-theme="light"] .bg-glow {
    background: radial-gradient(700px 500px at 15% -5%, rgba(109,92,255,.10), transparent 60%),
                radial-gradient(600px 400px at 85% 5%, rgba(214,94,240,.06), transparent 60%);
  }
  :root[data-theme="light"] .bg-grid {
    background-image: linear-gradient(rgba(0,0,0,.035) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,0,0,.035) 1px, transparent 1px);
  }
  :root[data-theme="light"] nav { background: rgba(255,255,255,.85); }
  :root[data-theme="light"] .cat-pill.active { color: #fff; }
  :root[data-theme="light"] .plugin-card:hover { background: rgba(109,92,255,.05); }
  :root[data-theme="light"] .plugin-card .p-tag { background: rgba(8,145,178,.08); border-color: rgba(8,145,178,.2); }
  :root[data-theme="light"] ::-webkit-scrollbar-thumb { background: #cbd5e1; }
  :root[data-theme="light"] .menu-toggle { color: var(--text); }
  :root[data-theme="light"] .search-bar input:focus { background: rgba(109,92,255,.05); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: rgba(109,92,255,.4); }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: #2a2d45; border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .bg-glow {
    position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background:
      radial-gradient(700px 500px at 15% -5%, rgba(109,92,255,.16), transparent 60%),
      radial-gradient(600px 400px at 85% 5%, rgba(214,94,240,.10), transparent 60%);
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 80% 50% at 50% 0%, #000 30%, transparent 80%);
  }
  .container { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }

  /* 导航 */
  nav { position: sticky; top: 0; z-index: 100; backdrop-filter: blur(14px); background: rgba(7,8,15,.8); border-bottom: 1px solid var(--border); }
  .nav-inner { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 68px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
  .brand img { width: 30px; height: 30px; border-radius: 8px; }
  .brand .badge { font-size: 10px; font-weight: 600; color: var(--accent); border: 1px solid rgba(34,211,238,.4); background: rgba(34,211,238,.1); padding: 2px 8px; border-radius: 999px; margin-left: 4px; }
  .nav-links { display: flex; gap: 26px; align-items: center; }
  .nav-links a { color: var(--text-2); font-size: 14.5px; transition: color .2s; }
  .nav-links a:hover, .nav-links a.active { color: var(--text); }
  .nav-actions { display: flex; gap: 12px; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; font-weight: 600; border-radius: 12px; padding: 10px 18px; border: 1px solid transparent; transition: all .22s; font-family: inherit; }
  .btn-ghost { color: var(--text-2); background: transparent; border-color: var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: var(--border-2); }
  .btn-primary { color: #fff; background: var(--grad-2); box-shadow: 0 8px 24px -8px rgba(109,92,255,.7); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 32px -8px rgba(109,92,255,.9); }
  .btn-sm { padding: 8px 16px; font-size: 13px; border-radius: 10px; }
  .theme-toggle { font-size: 16px; padding: 8px 12px; line-height: 1; }
  .menu-toggle { display: none; background: none; border: none; color: var(--text); font-size: 22px; cursor: pointer; }

  /* 页面头部 */
  .page-head { padding: 80px 0 40px; text-align: center; }
  .page-head h1 { font-size: clamp(32px, 5vw, 48px); font-weight: 800; letter-spacing: -.5px; margin-bottom: 16px; }
  .page-head h1 .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .page-head .sub { color: var(--text-2); font-size: 16px; max-width: 560px; margin: 0 auto 32px; }

  /* 搜索栏 */
  .search-bar { display: flex; gap: 12px; max-width: 560px; margin: 0 auto 32px; }
  .search-bar input {
    flex: 1; padding: 14px 18px; border-radius: 14px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    font-size: 15px; font-family: inherit; transition: all .2s;
  }
  .search-bar input::placeholder { color: var(--text-3); }
  .search-bar input:focus { outline: none; border-color: var(--primary); background: rgba(109,92,255,.06); }
  .search-bar button {
    padding: 14px 22px; border: none; border-radius: 14px;
    background: var(--grad-2); color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit; box-shadow: 0 6px 18px -6px rgba(109,92,255,.6);
    transition: all .22s;
  }
  .search-bar button:hover { transform: translateY(-2px); }

  /* 分类标签 */
  .categories { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 50px; }
  .cat-pill {
    padding: 8px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
    border: 1px solid var(--border); background: var(--panel); color: var(--text-2);
    cursor: pointer; transition: all .2s;
  }
  .cat-pill:hover { color: var(--text); border-color: var(--border-2); }
  .cat-pill.active { color: #fff; background: var(--grad-2); border-color: transparent; box-shadow: 0 4px 14px -4px rgba(109,92,255,.5); }

  /* 插件卡片网格 */
  .plugins-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-bottom: 60px; }
  .plugin-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 26px; transition: all .3s; position: relative; overflow: hidden;
    display: flex; flex-direction: column; cursor: pointer;
  }
  .plugin-card:hover { transform: translateY(-6px); border-color: rgba(109,92,255,.4); background: rgba(109,92,255,.05); }
  .plugin-card .ribbon {
    position: absolute; top: 14px; right: -28px; transform: rotate(35deg);
    font-size: 11px; font-weight: 700; padding: 3px 32px; color: #fff;
  }
  .ribbon.hot { background: linear-gradient(90deg, #f59e0b, #f97316); }
  .ribbon.new { background: linear-gradient(90deg, #10b981, #22d3ee); }
  .plugin-card .p-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .plugin-card .p-icon {
    width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    font-size: 24px; flex-shrink: 0;
  }
  .plugin-card .p-name { font-size: 17px; font-weight: 700; margin-bottom: 2px; }
  .plugin-card .p-ver { font-size: 12px; color: var(--text-3); }
  .plugin-card .p-desc { color: var(--text-2); font-size: 14px; margin-bottom: 18px; flex: 1; }
  .plugin-card .p-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .plugin-card .p-tag { font-size: 12px; color: var(--accent); background: rgba(34,211,238,.1); border: 1px solid rgba(34,211,238,.2); padding: 3px 10px; border-radius: 999px; }
  .plugin-card .p-meta { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; border-top: 1px solid var(--border); }
  .plugin-card .p-stats { display: flex; gap: 16px; font-size: 13px; color: var(--text-3); }
  .plugin-card .p-stats span { display: flex; align-items: center; gap: 4px; }
  .plugin-card .p-actions { display: flex; gap: 8px; }
  .install-btn {
    padding: 8px 18px; border: none; border-radius: 10px;
    background: var(--grad-2); color: #fff; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: all .2s;
    box-shadow: 0 4px 12px -4px rgba(109,92,255,.4);
  }
  .install-btn:hover { transform: translateY(-2px); }

  /* 加载更多 */
  .load-more { text-align: center; margin-bottom: 80px; }

  /* 页脚 */
  footer { border-top: 1px solid var(--border); padding: 40px 24px; }
  .foot-inner { max-width: var(--maxw); margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .foot-inner .l { color: var(--text-3); font-size: 13px; }
  .foot-inner .r { display: flex; gap: 18px; }
  .foot-inner .r a { color: var(--text-3); font-size: 13px; transition: color .2s; }
  .foot-inner .r a:hover { color: var(--text); }

  /* 响应式 */
  @media (max-width: 900px) {
    .nav-links { display: none; }
    .menu-toggle { display: block; }
    .plugins-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .plugins-grid { grid-template-columns: 1fr; }
    .nav-actions .gh-link { display: none; }
    .nav-actions .btn-primary { padding: 8px 14px; font-size: 13px; }
    .page-head { padding: 60px 0 30px; }
  }
</style>
</head>

<div class="bg-grid"></div>
